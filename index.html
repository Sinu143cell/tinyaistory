<!DOCTYPE html>
<html>
<head>
<title>Tiny Moral Tales</title>

<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f5f5f5;
}

.popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  background:white;
  padding:25px;
  border-radius:15px;
}

input{
  padding:10px;
}

button{
  padding:10px 20px;
  margin-top:10px;
}
</style>

</head>

<body>

<h1>📖 Tiny Moral Tales</h1>


<!-- Name Popup -->

<div class="popup" id="popup">

<div class="box">

<h2>Welcome 😊</h2>

<p>Enter Your Name</p>

<input id="name" placeholder="Your Name">

<br>

<button onclick="start()">Start Story</button>

</div>

</div>


<script>

function start(){

let name=document.getElementById("name").value;

if(name==""){
alert("Enter your name");
}
else{
document.getElementById("popup").style.display="none";
alert("Welcome "+name+" 😊");
}

}

</script>


</body>
</html>
